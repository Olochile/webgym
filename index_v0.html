<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMOM Duos Tracker - v3</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #00adb5;
            --accent-tu: #393e46;
            --accent-ella: #ff2e63;
            --text: #eeeeee;
            --danger: #d9534f;
            --next-btn: #f0a500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--primary);
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .main-timer {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 5px 0;
        }

        .status-bar {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            background-color: #333;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background-color: var(--primary);
            transition: width 1s linear;
        }

        .roles-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
        }

        .role-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 2px solid transparent;
            position: relative;
        }

        .role-card.tu { border-color: #4e54c8; }
        .role-card.ella { border-color: var(--accent-ella); }

        .role-title {
            font-size: 0.9rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .tu .role-title { background: #4e54c8; }
        .ella .role-title { background: var(--accent-ella); }

        .exercise-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reps {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .animation-box {
            width: 90px;
            height: 90px;
            background: #282828;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: auto;
            overflow: hidden;
        }

        .dummy-body {
            width: 24px;
            height: 40px;
            background: #aaa;
            border-radius: 6px;
            position: relative;
        }

        /* 1. Sentadilla */
        .anim-squat .dummy-body {
            animation: squatMove 2s infinite ease-in-out;
        }
        @keyframes squatMove {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(15px) scaleY(0.7); }
        }

        /* 2. Peso Muerto */
        .anim-deadlift .dummy-body {
            animation: deadliftMove 2s infinite ease-in-out;
            transform-origin: bottom center;
        }
        @keyframes deadliftMove {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(45deg); }
        }

        /* 3. Remo */
        .anim-row .dummy-body {
            transform: rotate(60deg);
        }
        .anim-row .dummy-body::after {
            content: '';
            width: 16px;
            height: 6px;
            background: var(--primary);
            position: absolute;
            top: 10px; right: -10px;
            animation: rowMove 1s infinite ease-in-out;
        }
        @keyframes rowMove {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-12px); }
        }

        /* 4. Flexiones */
        .anim-pushup .dummy-body {
            transform: rotate(90deg);
            animation: pushupMove 2s infinite ease-in-out;
        }
        @keyframes pushupMove {
            0%, 100% { transform: rotate(90deg) translateY(0); }
            50% { transform: rotate(90deg) translateY(12px); }
        }

        /* 5. Combo Brazos */
        .anim-arms .dummy-body::after {
            content: '';
            width: 8px;
            height: 20px;
            background: var(--primary);
            position: absolute;
            top: -10px; left: 8px;
            border-radius: 4px;
            animation: armMove 1.5s infinite ease-in-out;
            transform-origin: bottom center;
        }
        @keyframes armMove {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        /* 6. Plancha */
        .anim-plank .dummy-body {
            transform: rotate(90deg);
            animation: plankVibe 0.5s infinite linear;
        }
        @keyframes plankVibe {
            0%, 100% { transform: rotate(90deg) translateY(0); }
            50% { transform: rotate(90deg) translateY(1px); }
        }

        .controls {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-start { background: var(--primary); }
        .btn-pause { background: #555; }
        .btn-reset { background: var(--danger); }
        .btn-next { background: var(--next-btn); color: #121212; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>Rutina EMOM 24 Minutos</h1>
        <p id="bloque-indicador">Bloque 1: Piernas y Glúteos</p>
    </header>

    <div class="main-timer">
        <div class="status-bar" id="status-text">Preparados</div>
        <div class="time-display" id="time-display">03:00</div>
        <div id="round-display">Calentamiento Inicial</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="roles-container">
        <div class="role-card tu">
            <div class="role-title">Tú</div>
            <div class="exercise-name" id="ex-tu-name">Movilidad Articular</div>
            <div class="reps" id="ex-tu-reps">3 Minutos</div>
            <div class="animation-box" id="anim-tu">
                <div class="dummy-body"></div>
            </div>
        </div>

        <div class="role-card ella">
            <div class="role-title">Ella</div>
            <div class="exercise-name" id="ex-ella-name">Movilidad Articular</div>
            <div class="reps" id="ex-ella-reps">3 Minutos</div>
            <div class="animation-box" id="anim-ella">
                <div class="dummy-body"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="btn-row">
            <button class="btn-start" id="btn-main" onclick="toggleTimer()">Iniciar Entrenamiento</button>
            <button class="btn-pause hidden" id="btn-pause" onclick="pauseTimer()">Pausar</button>
            <button class="btn-next" id="btn-next" onclick="skipSection()">Siguiente ⏭️</button>
        </div>
        <button class="btn-reset hidden" id="btn-reset" onclick="resetTimer()">Reiniciar Rutina Completa</button>
    </div>

    <script>
        const rutina = [];
        
        for(let m = 1; m <= 8; m++) {
            if(m % 2 !== 0) {
                rutina.push({ bloque: "Bloque 1: Piernas", tu: { name: "Sentadilla Goblet", reps: "12-15 Reps", anim: "anim-squat" }, ella: { name: "Peso Muerto Rumano", reps: "12 Reps", anim: "anim-deadlift" } });
            } else {
                rutina.push({ bloque: "Bloque 1: Piernas", tu: { name: "Peso Muerto Rumano", reps: "15 Reps", anim: "anim-deadlift" }, ella: { name: "Sentadilla Goblet", reps: "10-12 Reps", anim: "anim-squat" } });
            }
        }
        for(let m = 9; m <= 16; m++) {
            if(m % 2 !== 0) {
                rutina.push({ bloque: "Bloque 2: Torso", tu: { name: "Remo a una mano", reps: "12 / lado", anim: "anim-row" }, ella: { name: "Press de Hombros", reps: "12 Reps (con 1 m.)", anim: "anim-arms" } });
            } else {
                rutina.push({ bloque: "Bloque 2: Torso", tu: { name: "Flexiones de Brazos", reps: "15 Reps", anim: "anim-pushup" }, ella: { name: "Remo a una mano", reps: "8-10 / lado", anim: "anim-row" } });
            }
        }
        for(let m = 17; m <= 24; m++) {
            if(m % 2 !== 0) {
                rutina.push({ bloque: "Bloque 3: Core y Brazos", tu: { name: "Combo Bíceps+Tríceps", reps: "12 Reps", anim: "anim-arms" }, ella: { name: "Plancha Abdominal", reps: "Aguanta 40s", anim: "anim-plank" } });
            } else {
                rutina.push({ bloque: "Bloque 3: Core y Brazos", tu: { name: "Plancha Abdominal", reps: "Aguanta 40s", anim: "anim-plank" }, ella: { name: "Combo Bíceps+Tríceps", reps: "8-10 Reps", anim: "anim-arms" } });
            }
        }

        let isWarmup = true;
        let currentMinuteIndex = 0; 
        let timeLeft = 180; 
        let timerInterval = null;
        let isRunning = false;

        const timeDisplay = document.getElementById('time-display');
        const statusText = document.getElementById('status-text');
        const roundDisplay = document.getElementById('round-display');
        const bloqueIndicador = document.getElementById('bloque-indicador');
        const progressBar = document.getElementById('progress-bar');
        const btnMain = document.getElementById('btn-main');
        const btnPause = document.getElementById('btn-pause');
        const btnReset = document.getElementById('btn-reset');
        const btnNext = document.getElementById('btn-next');

        function updateUI() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timeDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            let totalPeriod = isWarmup ? 180 : 60;
            let pct = (timeLeft / totalPeriod) * 100;
            progressBar.style.width = `${pct}%`;

            if (!isWarmup) {
                let data = rutina[currentMinuteIndex];
                bloqueIndicador.innerText = data.bloque;
                roundDisplay.innerText = `Minuto: ${currentMinuteIndex + 1} / 24`;
                statusText.innerText = "¡A TRABAJAR!";

                document.getElementById('ex-tu-name').innerText = data.tu.name;
                document.getElementById('ex-tu-reps').innerText = data.tu.reps;
                document.getElementById('anim-tu').className = `animation-box ${data.tu.anim}`;

                document.getElementById('ex-ella-name').innerText = data.ella.name;
                document.getElementById('ex-ella-reps').innerText = data.ella.reps;
                document.getElementById('anim-ella').className = `animation-box ${data.ella.anim}`;
            } else {
                bloqueIndicador.innerText = "Bloque 1: Piernas y Glúteos";
                statusText.innerText = "Preparados";
                roundDisplay.innerText = "Calentamiento Inicial";
                document.getElementById('ex-tu-name').innerText = "Movilidad Articular";
                document.getElementById('ex-tu-reps').innerText = "3 Minutos";
                document.getElementById('anim-tu').className = "animation-box";
                document.getElementById('ex-ella-name').innerText = "Movilidad Articular";
                document.getElementById('ex-ella-reps').innerText = "3 Minutos";
                document.getElementById('anim-ella').className = "animation-box";
            }
        }

        function toggleTimer() {
            if (!isRunning) {
                isRunning = true;
                btnMain.classList.add('hidden');
                btnPause.classList.remove('hidden');
                btnReset.classList.add('hidden');
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft < 0) {
                        handleTimeOut();
                    } else {
                        updateUI();
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            btnMain.innerText = "Reanudar";
            btnMain.classList.remove('hidden');
            btnPause.classList.add('hidden');
            btnReset.classList.remove('hidden');
        }

        function resetTimer() {
            const confirmar = confirm("¿Estás seguro de que quieres reiniciar la rutina completa desde el calentamiento?");
            if (confirmar) {
                isRunning = false;
                clearInterval(timerInterval);
                isWarmup = true;
                currentMinuteIndex = 0;
                timeLeft = 180;
                
                btnMain.innerText = "Iniciar Entrenamiento";
                btnMain.classList.remove('hidden');
                btnPause.classList.add('hidden');
                btnReset.classList.add('hidden');
                btnNext.classList.remove('hidden');
                updateUI();
            }
        }

        // Nueva función para saltar de sección manualmente ("Next")
        function skipSection() {
            if (isWarmup) {
                // Si está en calentamiento, salta directo al minuto 1 del EMOM
                isWarmup = false;
                currentMinuteIndex = 0;
                timeLeft = 60;
            } else {
                // Si está en el EMOM, pasa al siguiente minuto
                currentMinuteIndex++;
                timeLeft = 60;
            }
            
            // Verificar si el salto completó el entrenamiento
            if (currentMinuteIndex >= 24) {
                clearInterval(timerInterval);
                isRunning = false;
                statusText.innerText = "¡COMPLETADO!";
                timeDisplay.innerText = "00:00";
                bloqueIndicador.innerText = "Fin del entrenamiento";
                roundDisplay.innerText = "¡Gran trabajo en pareja!";
                btnMain.classList.add('hidden');
                btnPause.classList.add('hidden');
                btnNext.classList.add('hidden');
                btnReset.classList.remove('hidden');
                return;
            }
            
            playBeep();
            updateUI();
        }

        function handleTimeOut() {
            playBeep();

            if (isWarmup) {
                isWarmup = false;
                currentMinuteIndex = 0;
                timeLeft = 60;
            } else {
                currentMinuteIndex++;
                if (currentMinuteIndex >= 24) {
                    clearInterval(timerInterval);
                    statusText.innerText = "¡COMPLETADO!";
                    timeDisplay.innerText = "00:00";
                    bloqueIndicador.innerText = "Fin del entrenamiento";
                    roundDisplay.innerText = "¡Gran trabajo en pareja!";
                    btnMain.classList.add('hidden');
                    btnPause.classList.add('hidden');
                    btnNext.classList.add('hidden');
                    btnReset.classList.remove('hidden');
                    return;
                }
                timeLeft = 60;
            }
            updateUI();
        }

        function playBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                console.log("Restricción de audio.");
            }
        }
    </script>
</body>
</html>
